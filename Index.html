<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>File Transfer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .upload-box {
      border: 2px dashed #999;
      border-radius: 12px;
      padding: 30px 15px;
      background: #fafafa;
    }

    input[type="file"] {
      display: none;
    }

    .choose-btn {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 8px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #fileInfo {
      margin-top: 20px;
      color: #444;
      word-break: break-word;
      line-height: 1.6;
    }

    #timer {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #d00;
    }

    .upload-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .upload-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .link {
      display: inline-block;
      margin-top: 10px;
      color: #0066cc;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>File Transfer</h1>

    <p class="subtitle">
      Upload photos, videos and documents
    </p>

    <div class="upload-box">

      <p>
        📷 Photo &nbsp;
        🎥 Video &nbsp;
        📄 Document
      </p>

      <br>

      <label for="fileInput" class="choose-btn">
        Choose File
      </label>

      <input
        type="file"
        id="fileInput"
        accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip,.rar"
      >

      <div id="fileInfo">
        No file selected
      </div>

      <div id="timer"></div>

    </div>

    <button
      class="upload-btn"
      id="uploadBtn"
      disabled
    >
      ☁️ Upload File
    </button>

    <div id="status"></div>

  </div>


  <script>

    // Cloudinary settings
    const CLOUD_NAME = "pz6pcrmb";
    const UPLOAD_PRESET = "mywebsite";


    const fileInput =
      document.getElementById("fileInput");

    const fileInfo =
      document.getElementById("fileInfo");

    const uploadBtn =
      document.getElementById("uploadBtn");

    const timer =
      document.getElementById("timer");

    const status =
      document.getElementById("status");


    let selectedFile = null;

    let deleteTimer = null;
    let countdownTimer = null;


    // File select
    fileInput.addEventListener("change", function () {

      if (fileInput.files.length === 0) {
        selectedFile = null;
        uploadBtn.disabled = true;
        return;
      }

      selectedFile = fileInput.files[0];

      fileInfo.innerHTML =
        "<b>Selected File:</b><br>" +
        selectedFile.name +
        "<br>" +
        "Size: " +
        formatSize(selectedFile.size);

      uploadBtn.disabled = false;

      status.innerHTML = "";

      startTenMinuteTimer();

    });


    // Upload
    uploadBtn.addEventListener("click", async function () {

      if (!selectedFile) {
        return;
      }

      uploadBtn.disabled = true;

      status.className = "";
      status.innerHTML = "⏳ Uploading...";

      try {

        const formData = new FormData();

        formData.append(
          "file",
          selectedFile
        );

        formData.append(
          "upload_preset",
          UPLOAD_PRESET
        );


        const response = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,
          {
            method: "POST",
            body: formData
          }
        );


        const data = await response.json();


        if (!response.ok) {
          throw new Error(
            data.error?.message ||
            "Upload failed"
          );
        }


        status.className = "success";

        status.innerHTML =
          "✅ File uploaded successfully!<br>" +
          "<a class='link' href='" +
          data.secure_url +
          "' target='_blank'>" +
          "Open / Download File" +
          "</a>";


      } catch (error) {

        status.className = "error";

        status.innerHTML =
          "❌ Upload failed:<br>" +
          error.message;

        uploadBtn.disabled = false;
      }

    });


    // 10 minute browser timer
    function startTenMinuteTimer() {

      clearTimeout(deleteTimer);
      clearInterval(countdownTimer);

      let remaining = 10 * 60;

      showTime(remaining);


      countdownTimer =
        setInterval(function () {

          remaining--;

          showTime(remaining);

          if (remaining <= 0) {
            clearInterval(countdownTimer);
          }

        }, 1000);


      deleteTimer =
        setTimeout(function () {

          selectedFile = null;

          fileInput.value = "";

          fileInfo.innerHTML =
            "File removed from this page.";

          timer.innerHTML = "";

          uploadBtn.disabled = true;

        }, 10 * 60 * 1000);

    }


    function showTime(seconds) {

      const minutes =
        Math.floor(seconds / 60);

      const secs =
        seconds % 60;

      timer.innerHTML =
        "⏳ " +
        minutes +
        ":" +
        String(secs).padStart(2, "0");

    }


    function formatSize(bytes) {

      if (bytes < 1024) {
        return bytes + " Bytes";
      }

      if (bytes < 1024 * 1024) {
        return (
          bytes / 1024
        ).toFixed(2) + " KB";
      }

      if (bytes < 1024 * 1024 * 1024) {
        return (
          bytes / (1024 * 1024)
        ).toFixed(2) + " MB";
      }

      return (
        bytes / (1024 * 1024 * 1024)
      ).toFixed(2) + " GB";

    }

  </script>

</body>
</html>
