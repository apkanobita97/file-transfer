<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My File Transfer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f0ff, #f8f9ff);
    min-height: 100vh;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    margin-top: 30px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.room {
    background: #eef3f8;
    padding: 18px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 25px;
}

.room small {
    display: block;
    font-size: 16px;
    margin-bottom: 8px;
}

.code {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 8px;
}

input[type="file"] {
    width: 100%;
    padding: 10px;
    margin: 10px 0 15px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #1976d2;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #125ca5;
}

.files {
    margin-top: 30px;
}

.file {
    background: #f1f1f1;
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>📁 My File Transfer</h1>

<div class="subtitle">
Photo, Video & Documents
</div>

<div class="room">
<small>Your Room Code</small>
<div class="code" id="roomCode">583921</div>
</div>

<h2>Upload File</h2>

<input type="file" id="fileInput" multiple>

<button onclick="uploadFile()">📤 Upload</button>

<div class="files">
<h2>Uploaded Files</h2>

<div id="fileList"></div>

</div>

</div>
</div>

<script>

function uploadFile() {

    const input = document.getElementById("fileInput");
    const list = document.getElementById("fileList");

    if (input.files.length === 0) {
        alert("Please select a file");
        return;
    }

    for (let file of input.files) {

        const item = document.createElement("div");

        item.className = "file";

        item.innerHTML =
        "📄 " + file.name +
        "<br><small>Auto delete after 10 minutes</small>";

        list.appendChild(item);

        setTimeout(function() {
            item.remove();
        }, 10 * 60 * 1000);
    }

    alert(input.files.length + " file selected!");
}

</script>

</body>
</html>
